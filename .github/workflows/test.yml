name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv, because setup-python has no 3.9 build for the current ubuntu-latest image.
      - uses: astral-sh/setup-uv@v6
      # Offline only: no secrets, no calls to AADE. The XSD check is skipped unless AADE_XSD_DIR is set.
      - run: uv run --no-project --python ${{ matrix.python-version }} --with pytest python -m pytest -q
